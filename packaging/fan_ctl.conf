# fan_ctl configuration.
#
# Copy to /etc/fan_ctl.conf and uncomment what you want to change, then:
#   sudo systemctl restart fan_ctl
# Every line below shows the built-in default. Unknown keys are errors.

# --- PWM output -------------------------------------------------------------
# pwmchip whose `device` link contains this text (RP1 PIO PWM from the
# `dtoverlay=pwm-pio,gpio=27` line in /boot/firmware/config.txt).
#pwm_device = pwm_pio
#pwm_channel = 0
# 25 kHz is above hearing; lower frequencies made the tested fan whine.
#pwm_frequency_hz = 25000

# --- Fan speed --------------------------------------------------------------
# Lowest duty in %. The tested 2-wire fan barely moves air below 60 %.
# 0 allows the fan to stop when cool.
#min_duty = 60
# Duty changes in steps of this many %.
#step = 5
# °C the temperature must drop before the fan slows down.
#hysteresis = 3.0
# Full speed for this long whenever the fan starts (0 disables).
#kick_ms = 2000

# --- Curves (°C): min_duty at *_start, rising linearly to 100 % at *_full ----
# The hotter sensor decides. The NVMe is the part that overheats in a closed case.
#nvme_start = 55
#nvme_full = 72
#cpu_start = 60
#cpu_full = 80

# --- Active Cooler (manual control only) -------------------------------------
# CPU °C at which a manual cooler level (`fan_ctl set --cooler N`) is handed
# back to the kernel (released `hysteresis` °C below). 40..=90.
#cooler_safety = 75

# --- Polling (seconds) ------------------------------------------------------
# While at min_duty / while above it.
#interval_idle_s = 15
#interval_active_s = 5
