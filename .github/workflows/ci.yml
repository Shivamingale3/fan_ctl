name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-unknown-linux-musl

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Docs (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -s sh packaging/install.sh

  build:
    name: build aarch64 (static musl)
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: cargo build --release --locked --target "$TARGET"
      - name: Verify static aarch64 binary
        run: |
          BIN="target/$TARGET/release/fan_ctl"
          file "$BIN" | tee /dev/stderr | grep -q "ARM aarch64.*statically linked"
          ls -l "$BIN"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fan_ctl-aarch64
          path: target/${{ env.TARGET }}/release/fan_ctl
          if-no-files-found: error

  smoke:
    name: smoke test on arm64
    runs-on: ubuntu-24.04-arm
    needs: build
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fan_ctl-aarch64
      - run: chmod +x fan_ctl && ./fan_ctl --version && ./fan_ctl --help
